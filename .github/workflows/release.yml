name: Release Theme Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Build project
        run: npm run build

      - name: Update theme configuration
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Get current date in YY.MM.DD format
          VERSION_DATE=$(date +"%y.%m.%d")
          # Get commit hash (short)
          COMMIT_HASH=$(git rev-parse --short HEAD)

          echo "VERSION_DATE=${VERSION_DATE}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

          # Write release version (tag) to komari-theme.json, strip leading 'v' prefix
          CLEAN_VERSION="${RELEASE_VERSION#v}"
          jq --arg version "$CLEAN_VERSION" \
             '.version = $version' \
             komari-theme.json > komari-theme-updated.json

          mv komari-theme-updated.json komari-theme.json

          echo "Updated theme configuration:"
          cat komari-theme.json

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          PREVIEW_FILE=$(jq -r '.preview' komari-theme.json)
          test -n "$PREVIEW_FILE" && test "$PREVIEW_FILE" != "null" || (echo "Theme preview is not configured" && exit 1)
          ls -la preview.png || (echo "preview.png not found" && exit 1)
          ls -la "$PREVIEW_FILE" || (echo "$PREVIEW_FILE not found" && exit 1)
          ls -la komari-theme.json || (echo "komari-theme.json not found" && exit 1)
          ls -la dist/ || (echo "dist/ directory not found" && exit 1)
          echo "All required files found!"

      - name: Create theme package
        id: package
        run: |
          # Create a temporary directory for the package
          mkdir -p theme-package

          # Copy required files
          PREVIEW_FILE=$(jq -r '.preview' komari-theme.json)
          cp preview.png theme-package/
          if [ "$PREVIEW_FILE" != "preview.png" ]; then
            cp "$PREVIEW_FILE" theme-package/
          fi
          cp komari-theme.json theme-package/
          cp -r dist/ theme-package/

          # Create a versioned theme package, e.g., nezha-v2.1.0.zip
          ZIP_NAME="nezha-${RELEASE_VERSION}.zip"

          cd theme-package
          zip -r ../${ZIP_NAME} .
          cd ..

          # Komari extracts themes on Linux. Reject Windows-style archive paths,
          # which would leave dist/index.html missing and trigger the default theme.
          unzip -Z1 "${ZIP_NAME}" > package-entries.txt
          if awk 'index($0, sprintf("%c", 92)) { found = 1 } END { exit found ? 0 : 1 }' package-entries.txt; then
            echo "Package contains Windows-style path separators"
            exit 1
          fi
          for REQUIRED_ENTRY in komari-theme.json preview.png "${PREVIEW_FILE}" dist/index.html; do
            grep -Fxq "${REQUIRED_ENTRY}" package-entries.txt || {
              echo "Package is missing ${REQUIRED_ENTRY}"
              exit 1
            }
          done

          # Expose as step output for later steps
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "Created package: ${ZIP_NAME}"
          ls -la ${ZIP_NAME}

      - name: Preserve theme package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: ${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
